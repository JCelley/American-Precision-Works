<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tool Library Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0a0f1a;
      --mid:     #111827;
      --panel:   #1a2234;
      --panel2:  #1e2840;
      --border:  #243050;
      --border2: #2d3f5e;
      --text:    #e8edf5;
      --muted:   #6b7a99;
      --accent:  #00aaff;
      --green:   #00e676;
      --warn:    #ffaa00;
      --blue:    #0057A8;
      --red:     #ff4444;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
      --display: 'Bebas Neue', sans-serif;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }

    /* ── TOP BAR ── */
    .topbar {
      height: 56px; background: var(--mid); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-logo { font-family: var(--display); font-size: 1.4rem; letter-spacing: 0.08em; color: var(--text); white-space: nowrap; }
    .topbar-logo span { color: var(--accent); }
    .topbar-divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }

    /* unit toggle */
    .unit-toggle { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .unit-btn { font-family: var(--mono); font-size: 0.7rem; padding: 5px 12px; cursor: pointer; border: none; background: transparent; color: var(--muted); letter-spacing: 0.06em; transition: all 0.15s; }
    .unit-btn.active { background: var(--accent); color: #000; font-weight: 700; }

    /* export/import */
    .topbar-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .tb-btn { font-family: var(--mono); font-size: 0.7rem; padding: 6px 12px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; letter-spacing: 0.06em; transition: all 0.15s; white-space: nowrap; }
    .tb-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tb-btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
    .tb-btn.primary:hover { filter: brightness(1.15); }
    .export-badge { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); }
    .export-badge.warn { color: var(--warn); }

    /* ── APP LAYOUT ── */
    .app { display: flex; height: calc(100vh - 56px); overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px; flex-shrink: 0; background: var(--mid); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-section { padding: 16px 14px 8px; }
    .sidebar-label { font-family: var(--mono); font-size: 0.6rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
    .filter-btn {
      display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 4px;
      font-family: var(--mono); font-size: 0.75rem; color: var(--muted); background: transparent;
      border: none; cursor: pointer; letter-spacing: 0.04em; transition: all 0.15s; margin-bottom: 2px;
    }
    .filter-btn:hover { background: var(--panel); color: var(--text); }
    .filter-btn.active { background: var(--panel2); color: var(--accent); border-left: 2px solid var(--accent); }
    .filter-count { float: right; font-size: 0.65rem; color: var(--muted); margin-top: 1px; }

    .sidebar-divider { border: none; border-top: 1px solid var(--border); margin: 8px 14px; }

    /* feature filters */
    .feat-filter { display: flex; flex-direction: column; gap: 6px; padding: 0 14px 12px; }
    .feat-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .feat-row input[type="checkbox"] { accent-color: var(--accent); width: 13px; height: 13px; }
    .feat-row label { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); cursor: pointer; letter-spacing: 0.04em; }
    .feat-row input:checked + label { color: var(--accent); }

    /* diameter range */
    .range-filter { padding: 0 14px 16px; }
    .range-row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .range-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.75rem; padding: 5px 8px; border-radius: 3px; width: 70px; outline: none; }
    .range-input:focus { border-color: var(--accent); }
    .range-sep { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }

    /* ── MAIN CONTENT ── */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* toolbar */
    .content-toolbar {
      padding: 12px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; background: var(--mid);
    }
    .search-wrap { position: relative; flex: 1; max-width: 320px; }
    .search-wrap input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.82rem; padding: 7px 10px 7px 32px; border-radius: 4px; outline: none; transition: border-color 0.15s; }
    .search-wrap input:focus { border-color: var(--accent); }
    .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 0.8rem; pointer-events: none; }
    .tool-count-badge { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }
    .tool-count-badge span { color: var(--accent); font-weight: 700; }

    /* grid */
    .tools-grid { flex: 1; overflow-y: auto; padding: 16px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; align-content: start; }

    /* tool card */
    .tool-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
      padding: 14px; cursor: pointer; transition: border-color 0.15s, transform 0.1s, box-shadow 0.15s;
      position: relative; overflow: hidden;
    }
    .tool-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent); transform: scaleX(0); transform-origin: left; transition: transform 0.2s; }
    .tool-card:hover::before { transform: scaleX(1); }
    .tool-card:hover { border-color: var(--border2); transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }

    .tc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .tc-id { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; }
    .tc-type-badge { font-family: var(--mono); font-size: 0.6rem; padding: 2px 7px; border-radius: 3px; border: 1px solid var(--border2); color: var(--accent); background: rgba(0,170,255,0.08); letter-spacing: 0.06em; white-space: nowrap; }

    .tc-photo { width: 100%; height: 80px; background: var(--bg); border-radius: 4px; margin-bottom: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border); }
    .tc-photo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .tc-photo-placeholder { font-size: 1.8rem; opacity: 0.2; }

    .tc-name { font-family: var(--sans); font-size: 0.88rem; font-weight: 600; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
    .tc-meta { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); line-height: 1.6; }
    .tc-meta span { color: var(--text); }

    .tc-footer { display: flex; align-items: center; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
    .tc-loc { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); flex: 1; }
    .tc-loc span { color: var(--warn); font-weight: 600; }
    .tc-print-btn { font-family: var(--mono); font-size: 0.62rem; padding: 3px 8px; border: 1px solid var(--border); background: transparent; color: var(--muted); border-radius: 3px; cursor: pointer; transition: all 0.15s; }
    .tc-print-btn:hover { border-color: var(--accent); color: var(--accent); }

    .empty-state { grid-column: 1/-1; text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 3rem; opacity: 0.2; display: block; margin-bottom: 12px; }
    .empty-state-text { font-family: var(--mono); font-size: 0.82rem; color: var(--muted); margin-bottom: 16px; }

    /* ── DETAIL / EDIT PANEL ── */
    .detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; }
    .detail-overlay.open { display: block; }
    .detail-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 560px; background: var(--mid);
      border-left: 1px solid var(--border); z-index: 201; display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.25s ease;
      overflow: hidden;
    }
    .detail-panel.open { transform: translateX(0); }

    .dp-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .dp-title { font-family: var(--display); font-size: 1.3rem; letter-spacing: 0.06em; flex: 1; }
    .dp-id-badge { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); background: var(--bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 3px; }
    .dp-close { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 30px; height: 30px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
    .dp-close:hover { border-color: var(--red); color: var(--red); }

    .dp-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .dp-tab { font-family: var(--mono); font-size: 0.72rem; padding: 10px 16px; cursor: pointer; border: none; background: transparent; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; letter-spacing: 0.06em; transition: all 0.15s; }
    .dp-tab:hover { color: var(--text); }
    .dp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .dp-body { flex: 1; overflow-y: auto; padding: 20px; }

    /* view mode */
    .detail-photo { width: 100%; height: 160px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; overflow: hidden; }
    .detail-photo img { max-width: 100%; max-height: 100%; object-fit: contain; padding: 8px; }
    .detail-photo-placeholder { font-size: 3rem; opacity: 0.15; }

    .detail-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .detail-field { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px; }
    .detail-field-label { font-family: var(--mono); font-size: 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 3px; }
    .detail-field-value { font-family: var(--mono); font-size: 0.85rem; color: var(--text); font-weight: 600; }
    .detail-field.full { grid-column: 1/-1; }
    .detail-field.highlight .detail-field-value { color: var(--accent); }

    .detail-section-title { font-family: var(--mono); font-size: 0.65rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }

    .jobs-list { display: flex; flex-direction: column; gap: 6px; }
    .job-tag { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 6px 10px; font-family: var(--mono); font-size: 0.78rem; color: var(--text); }
    .job-remove { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.8rem; padding: 0; transition: color 0.15s; }
    .job-remove:hover { color: var(--red); }
    .job-add-row { display: flex; gap: 8px; margin-top: 8px; }
    .job-select { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.78rem; padding: 7px 10px; border-radius: 4px; outline: none; }
    .job-select:focus { border-color: var(--accent); }

    .dp-actions { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; }
    .dp-btn { font-family: var(--mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; border: none; border-radius: 4px; padding: 10px 16px; cursor: pointer; transition: opacity 0.2s; flex: 1; }
    .dp-btn:hover { opacity: 0.85; }
    .dp-btn.blue { background: var(--blue); color: #fff; }
    .dp-btn.green { background: #00875a; color: #fff; }
    .dp-btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .dp-btn.ghost:hover { color: var(--text); border-color: var(--muted); }
    .dp-btn.danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
    .dp-btn.danger:hover { background: var(--red); color: #fff; opacity: 1; }

    /* ── EDIT FORM ── */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1/-1; }
    .form-label { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
    .form-input { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: 0.82rem; padding: 8px 10px; border-radius: 4px; outline: none; width: 100%; transition: border-color 0.15s; }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--muted); }
    select.form-input { cursor: pointer; }
    textarea.form-input { resize: vertical; min-height: 64px; font-size: 0.8rem; line-height: 1.5; }

    /* photo upload in form */
    .photo-upload-area { border: 2px dashed var(--border); border-radius: 6px; padding: 20px; text-align: center; cursor: pointer; position: relative; transition: all 0.2s; background: var(--bg); }
    .photo-upload-area:hover, .photo-upload-area.drag-over { border-color: var(--accent); background: rgba(0,170,255,0.04); }
    .photo-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
    .photo-upload-text { font-family: var(--mono); font-size: 0.7rem; color: var(--muted); }
    .photo-preview-wrap { position: relative; display: inline-block; }
    .photo-preview { max-height: 80px; max-width: 100%; border-radius: 4px; display: block; margin: 0 auto; }
    .photo-clear { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; background: var(--red); color: #fff; border: none; border-radius: 50%; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    .form-section-title { font-family: var(--mono); font-size: 0.62rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; grid-column: 1/-1; padding-top: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }

    /* EDP in form */
    .edp-form-list { display: flex; flex-direction: column; gap: 6px; }
    .edp-form-row { display: flex; gap: 8px; align-items: center; }
    .edp-form-row .form-input { flex: 1; }
    .edp-rm { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 28px; height: 28px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; transition: all 0.15s; flex-shrink: 0; }
    .edp-rm:hover { border-color: var(--red); color: var(--red); }
    .btn-add-edp-form { font-family: var(--mono); font-size: 0.68rem; color: var(--accent); background: transparent; border: 1px dashed var(--border); border-radius: 4px; padding: 6px 10px; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; text-align: left; margin-top: 4px; }
    .btn-add-edp-form:hover { border-color: var(--accent); background: rgba(0,170,255,0.05); }

    /* ── JOBS MANAGER MODAL ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 300; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--mid); border: 1px solid var(--border); border-radius: 8px; width: 420px; max-height: 80vh; display: flex; flex-direction: column; animation: modalIn 0.18s ease; }
    @keyframes modalIn { from { opacity:0; transform: scale(0.96) translateY(-8px); } to { opacity:1; transform: scale(1) translateY(0); } }
    .modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-title { font-family: var(--display); font-size: 1.1rem; letter-spacing: 0.06em; }
    .modal-body { padding: 16px 20px; overflow-y: auto; flex: 1; }
    .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

    .job-list-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 6px; font-family: var(--mono); font-size: 0.8rem; color: var(--text); }
    .job-list-item-name { flex: 1; }
    .job-list-rm { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; padding: 2px 6px; border-radius: 3px; transition: all 0.15s; }
    .job-list-rm:hover { color: var(--red); background: rgba(255,68,68,0.1); }
    .job-add-form { display: flex; gap: 8px; margin-top: 12px; }

    /* ── PRINT ── */
    #print-container { display: none; }
    @media print {
      body > *:not(#print-container) { display: none !important; }
      #print-container { display: block !important; }
      @page { size: 3.5in 1.1in; margin: 0; }
      .print-page { page-break-after: always; width: 3.5in; height: 1.1in; overflow: hidden; }
      .print-page:last-child { page-break-after: avoid; }
      .print-page .label-card { width: 3.5in; height: 1.1in; border: none; border-radius: 0; box-shadow: none; }
      .print-page .label-left { padding: 5px 6px; }
      .print-page .label-lc { font-size: 16px; border-width: 1.5px; padding: 0 4px; min-width: 22px; }
      .print-page .label-tool-id { font-size: 14px; border-width: 1.5px; border-radius: 25px; padding: 0 7px; }
      .print-page .label-top-row { gap: 5px; }
      .print-page .label-desc { font-size: 9px; padding: 2px 0; }
      .print-page .label-edps { font-size: 8px; }
      .print-page .label-img-area { width: 1.4in; border-left-width: 1px; }
    }

    /* label card (for print) */
    .label-card { width: 630px; height: 198px; background: #fff; border: 1px solid #ccc; border-radius: 4px; display: flex; flex-direction: row; align-items: stretch; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
    .label-left { flex: 1; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; overflow: hidden; }
    .label-top-row { display: flex; align-items: center; gap: 10px; }
    .label-lc { font-size: 32px; font-weight: 900; color: #000; border: 3px solid #000; border-radius: 4px; padding: 0px 8px; line-height: 1.1; min-width: 44px; text-align: center; flex-shrink: 0; }
    .label-tool-id { font-size: 28px; font-weight: 900; color: #000; border: 3px solid #000; border-radius: 50px; padding: 1px 14px; white-space: nowrap; line-height: 1.2; }
    .label-desc { font-size: 18px; font-weight: 700; color: #000; line-height: 1.25; flex: 1; display: flex; align-items: center; padding: 4px 0; overflow: hidden; word-break: break-word; min-width: 0; }
    .label-desc span { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; word-wrap: break-word; width: 100%; }
    .label-edps { font-size: 15px; font-weight: 600; color: #000; line-height: 1.3; }
    .label-img-area { width: 252px; flex-shrink: 0; border-left: 2px solid #000; display: flex; align-items: center; justify-content: center; background: #f5f5f5; overflow: hidden; }
    .label-img-area img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
    .label-img-placeholder { font-size: 11px; color: #bbb; text-align: center; font-family: Arial, sans-serif; padding: 8px; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-logo">Tool <span>Library</span> Manager</div>
  <div class="topbar-divider"></div>
  <div class="unit-toggle">
    <button class="unit-btn active" id="unitIn" onclick="setUnit('in')">IN</button>
    <button class="unit-btn" id="unitMm" onclick="setUnit('mm')">MM</button>
  </div>
  <div class="topbar-right">
    <span class="export-badge" id="exportBadge"></span>
    <button class="tb-btn" onclick="document.getElementById('importInput').click()">⬆ Import</button>
    <input type="file" id="importInput" accept=".json" style="display:none" onchange="importLibrary(event)" />
    <button class="tb-btn" onclick="exportLibrary()">⬇ Export Backup</button>
    <button class="tb-btn" onclick="openJobsModal()">⚙ Manage Jobs</button>
    <button class="tb-btn primary" onclick="openAddTool()">+ Add Tool</button>
  </div>
</div>

<!-- APP -->
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Browse By Type</div>
      <button class="filter-btn active" data-type="ALL" onclick="setTypeFilter('ALL')">All Tools <span class="filter-count" id="cnt-ALL">0</span></button>
      <button class="filter-btn" data-type="Endmill" onclick="setTypeFilter('Endmill')">Endmill <span class="filter-count" id="cnt-Endmill">0</span></button>
      <button class="filter-btn" data-type="Ball Mill" onclick="setTypeFilter('Ball Mill')">Ball Mill <span class="filter-count" id="cnt-Ball Mill">0</span></button>
      <button class="filter-btn" data-type="Bull Nose Mill" onclick="setTypeFilter('Bull Nose Mill')">Bull Nose Mill <span class="filter-count" id="cnt-Bull Nose Mill">0</span></button>
      <button class="filter-btn" data-type="Chamfer Mill" onclick="setTypeFilter('Chamfer Mill')">Chamfer Mill <span class="filter-count" id="cnt-Chamfer Mill">0</span></button>
      <button class="filter-btn" data-type="Corner Rounding" onclick="setTypeFilter('Corner Rounding')">Corner Rounding <span class="filter-count" id="cnt-Corner Rounding">0</span></button>
      <button class="filter-btn" data-type="Thread Mill" onclick="setTypeFilter('Thread Mill')">Thread Mill <span class="filter-count" id="cnt-Thread Mill">0</span></button>
      <button class="filter-btn" data-type="Insert Mill Body" onclick="setTypeFilter('Insert Mill Body')">Insert Mill Body <span class="filter-count" id="cnt-Insert Mill Body">0</span></button>
      <button class="filter-btn" data-type="Insert" onclick="setTypeFilter('Insert')">Insert <span class="filter-count" id="cnt-Insert">0</span></button>
      <button class="filter-btn" data-type="Drill" onclick="setTypeFilter('Drill')">Drill <span class="filter-count" id="cnt-Drill">0</span></button>
      <button class="filter-btn" data-type="Spot Drill" onclick="setTypeFilter('Spot Drill')">Spot Drill <span class="filter-count" id="cnt-Spot Drill">0</span></button>
      <button class="filter-btn" data-type="Center Drill" onclick="setTypeFilter('Center Drill')">Center Drill <span class="filter-count" id="cnt-Center Drill">0</span></button>
      <button class="filter-btn" data-type="Tap" onclick="setTypeFilter('Tap')">Tap <span class="filter-count" id="cnt-Tap">0</span></button>
      <button class="filter-btn" data-type="Reamer" onclick="setTypeFilter('Reamer')">Reamer <span class="filter-count" id="cnt-Reamer">0</span></button>
      <button class="filter-btn" data-type="Boring Bar" onclick="setTypeFilter('Boring Bar')">Boring Bar <span class="filter-count" id="cnt-Boring Bar">0</span></button>
      <button class="filter-btn" data-type="Saw" onclick="setTypeFilter('Saw')">Saw / Slitting Saw <span class="filter-count" id="cnt-Saw">0</span></button>

    <div class="sidebar-section">
      <div class="sidebar-label">Features</div>
    </div>
    <div class="feat-filter">
      <div class="feat-row"><input type="checkbox" id="f-tsc" onchange="applyFilters()"><label for="f-tsc">TSC Only</label></div>
      <div class="feat-row"><input type="checkbox" id="f-bc" onchange="applyFilters()"><label for="f-bc">Bottom Cutting</label></div>
      <div class="feat-row"><input type="checkbox" id="f-reduced" onchange="applyFilters()"><label for="f-reduced">Reduced Shank</label></div>
    </div>

    <hr class="sidebar-divider" />

    <div class="sidebar-section">
      <div class="sidebar-label">Diameter Range <span style="color:var(--accent);font-size:0.6rem" id="diam-unit-label">(in)</span></div>

    <div class="range-filter">
      <div class="range-row">
        <input class="range-input" type="number" id="diam-min" placeholder="Min" step="0.001" oninput="applyFilters()" />
        <span class="range-sep">—</span>

  <div class="main-content">

        <span class="search-icon">🔍</span>

      <div class="tool-count-badge"><span id="visibleCount">0</span> tools shown</div>

    <div class="tools-grid" id="toolsGrid"></div>

</div>

<!-- DETAIL PANEL OVERLAY -->
<div class="detail-overlay" id="detailOverlay" onclick="closeDetail()"></div>

<!-- DETAIL / EDIT PANEL -->
<div class="detail-panel" id="detailPanel">
  <div class="dp-header">
    <div class="dp-title" id="dpTitle">Tool Detail</div>
    <div class="dp-id-badge" id="dpIdBadge">#001</div>
    <button class="dp-close" onclick="closeDetail()">✕</button>
  </div>
  <div class="dp-tabs">
    <button class="dp-tab active" onclick="switchDpTab('detail')">Detail</button>
    <button class="dp-tab" onclick="switchDpTab('jobs')">Jobs</button>
    <button class="dp-tab" onclick="switchDpTab('edit')">Edit</button>
  </div>

</div>

<!-- JOBS MODAL -->
<div class="modal-overlay" id="jobsModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Manage Part Numbers</div>
      <button class="dp-close" onclick="closeJobsModal()">✕</button>
    </div>
    <div class="modal-body">
      <div id="jobListContainer"></div>
      <div class="job-add-form">
        <input class="form-input" id="newJobInput" placeholder="Enter part number..." style="flex:1" onkeydown="if(event.key==='Enter')addJob()" />
        <button class="tb-btn primary" onclick="addJob()">Add</button>
      </div>
    </div>

      <button class="dp-btn ghost" style="flex:0;padding:8px 20px" onclick="closeJobsModal()">Done</button>
    </div>
  </div>
</div>

<!-- PRINT CONTAINER -->
<div id="print-container"></div>

<script>
// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let library     = { tools: [], jobs: [], nextId: 1, lastExport: null };
let currentUnit = 'in';
let typeFilter  = 'ALL';
let activeTool  = null;
let dpMode      = 'detail'; // 'detail' | 'jobs' | 'edit'
let editPhoto   = null;     // base64 for current edit session

const TOOL_TYPES = [
  'Endmill','Ball Mill','Bull Nose Mill','Chamfer Mill','Corner Rounding',
  'Thread Mill','Insert Mill Body','Insert','Drill','Spot Drill','Center Drill',
  'Tap','Reamer','Boring Bar','Saw'
];

const COATINGS = ['None','TiN','TiAlN','AlTiN','ZrN','DLC','TiCN','TiB2','Diamond','Other'];
const TAP_TYPES = ['Bottoming','Spiral Cut','Straight Cut','Form/Roll'];
const THREAD_STDS = ['UNC','UNF','UNEF','Metric','BSPP','BSPT','NPT','Other'];
const DRILL_TYPES = ['Twist','Indexable','Spade','Gun','Step'];
const REAMER_TYPES = ['Machine','Hand','Adjustable'];
const CD_TYPES = ['Type A','Type B','Type R'];
const BC_TYPES = ['Full Center Cutting','Partial Center Cutting','Non Center Cutting'];

// ═══════════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════════
function saveLibrary() {
  localStorage.setItem('apw_tool_library', JSON.stringify(library));
  updateExportBadge();
}

function loadLibrary() {
  const raw = localStorage.getItem('apw_tool_library');
  if (raw) {
    try { library = JSON.parse(raw); }
    catch(e) { console.error('Failed to load library', e); }
  }
  updateExportBadge();
}

function exportLibrary() {
  library.lastExport = new Date().toISOString();
  saveLibrary();
  const blob = new Blob([JSON.stringify(library, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'tool-library-backup.json'; a.click();
  URL.revokeObjectURL(url);
  updateExportBadge();
}

function importLibrary(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.tools && Array.isArray(data.tools)) {
        library = data;
        saveLibrary();
        renderAll();
        alert('Library imported successfully — ' + library.tools.length + ' tools loaded.');
      } else { alert('Invalid library file.'); }
    } catch(err) { alert('Could not read file: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function updateExportBadge() {
  const badge = document.getElementById('exportBadge');
  if (!library.lastExport) { badge.textContent = 'Never exported'; badge.className = 'export-badge warn'; return; }
  const days = Math.floor((Date.now() - new Date(library.lastExport)) / 86400000);
  if (days === 0) { badge.textContent = 'Exported today'; badge.className = 'export-badge'; }
  else if (days <= 7) { badge.textContent = `Exported ${days}d ago`; badge.className = 'export-badge'; }
  else { badge.textContent = `⚠ Exported ${days}d ago`; badge.className = 'export-badge warn'; }
}

// ═══════════════════════════════════════════════════════
// UNIT TOGGLE
// ═══════════════════════════════════════════════════════
function setUnit(u) {
  currentUnit = u;
  document.getElementById('unitIn').classList.toggle('active', u === 'in');
  document.getElementById('unitMm').classList.toggle('active', u === 'mm');
  document.getElementById('diam-unit-label').textContent = '(' + u + ')';
  renderAll();
}

function displayDiam(val) {
  if (!val && val !== 0) return '—';
  const n = parseFloat(val);
  if (isNaN(n)) return val;
  if (currentUnit === 'mm') return (n * 25.4).toFixed(3) + ' mm';
  return n.toFixed(4) + '"';
}

function displayLen(val) { return displayDiam(val); }

// ═══════════════════════════════════════════════════════
// TOOL ID
// ═══════════════════════════════════════════════════════
function nextToolId() {
  const id = library.nextId || 1;
  library.nextId = id + 1;
  return String(id).padStart(3, '0');
}

// ═══════════════════════════════════════════════════════
// FILTERS & RENDER
// ═══════════════════════════════════════════════════════
function setTypeFilter(type) {
  typeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  applyFilters();
}

function applyFilters() {
  const q       = document.getElementById('searchInput').value.trim().toLowerCase();
  const tsc     = document.getElementById('f-tsc').checked;
  const bc      = document.getElementById('f-bc').checked;
  const reduced = document.getElementById('f-reduced').checked;
  const dMin    = parseFloat(document.getElementById('diam-min').value);
  const dMax    = parseFloat(document.getElementById('diam-max').value);
  const jobF    = document.getElementById('job-filter').value;

  const filtered = library.tools.filter(t => {
    if (typeFilter !== 'ALL' && t.type !== typeFilter) return false;
    if (tsc && t.tsc !== 'Yes') return false;
    if (bc  && t.bottomCutting === 'Non Center Cutting') return false;
    if (reduced && t.reducedShank !== 'Yes') return false;
    if (!isNaN(dMin)) {
      const dv = currentUnit === 'mm' ? (parseFloat(t.diameter||0)*25.4) : parseFloat(t.diameter||0);
      if (isNaN(dv) || dv < dMin) return false;
    }
    if (!isNaN(dMax)) {
      const dv = currentUnit === 'mm' ? (parseFloat(t.diameter||0)*25.4) : parseFloat(t.diameter||0);
      if (isNaN(dv) || dv > dMax) return false;
    }
    if (jobF && !(t.jobs||[]).includes(jobF)) return false;
    if (q) {
      const hay = [t.id,t.type,t.description,t.proShopNum,t.rtaNum,t.location,
                   t.vendor,t.edps||'',(t.jobs||[]).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  renderGrid(filtered);
  document.getElementById('visibleCount').textContent = filtered.length;
}

function renderAll() {
  updateTypeCounts();
  updateJobFilter();
  applyFilters();
}

function updateTypeCounts() {
  const counts = {};
  TOOL_TYPES.forEach(t => counts[t] = 0);
  library.tools.forEach(t => { if (counts[t.type] !== undefined) counts[t.type]++; });
  const total = library.tools.length;
  const allEl = document.getElementById('cnt-ALL');
  if (allEl) allEl.textContent = total;
  TOOL_TYPES.forEach(t => {
    const el = document.getElementById('cnt-' + t);
    if (el) el.textContent = counts[t] || 0;
  });
}

function updateJobFilter() {
  const sel = document.getElementById('job-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">All Jobs</option>';
  (library.jobs||[]).forEach(j => {
    const o = document.createElement('option');
    o.value = j; o.textContent = j;
    if (j === cur) o.selected = true;
    sel.appendChild(o);
  });
}

function renderGrid(tools) {
  const grid = document.getElementById('toolsGrid');
  if (!tools.length) {
    grid.innerHTML = `<div class="empty-state">
      <span class="empty-state-icon">🔧</span>
      <div class="empty-state-text">No tools found. Add your first tool or adjust filters.</div>
      <button class="tb-btn primary" onclick="openAddTool()">+ Add Tool</button>
    </div>`;
    return;
  }
  grid.innerHTML = tools.map(t => buildToolCard(t)).join('');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function buildToolCard(t) {
  const photoHTML = t.photo
    ? `<img src="${t.photo}" alt="tool" />`
    : `<span class="tc-photo-placeholder">🔧</span>`;

  const metaLines = [];
  if (t.diameter) metaLines.push(`Ø <span>${displayDiam(t.diameter)}</span>`);
  if (t.flutes)   metaLines.push(`Flutes <span>${esc(t.flutes)}</span>`);
  if (t.loc)      metaLines.push(`LOC <span>${displayLen(t.loc)}</span>`);
  if (t.coating && t.coating !== 'None') metaLines.push(`Coating <span>${esc(t.coating)}</span>`);
  if (t.tsc === 'Yes') metaLines.push(`<span style="color:var(--green)">TSC</span>`);
  if (t.bottomCutting && t.bottomCutting !== 'Non Center Cutting') metaLines.push(`<span style="color:var(--accent)">Center Cut</span>`);

  return `<div class="tool-card" onclick="openDetail('${t.id}')">
    <div class="tc-top">
      <div class="tc-id">#${esc(t.id)}</div>
      <div class="tc-type-badge">${esc(t.type)}</div>
    </div>
    <div class="tc-photo">${photoHTML}</div>
    <div class="tc-name">${esc(t.description || 'Unnamed Tool')}</div>
    <div class="tc-meta">${metaLines.join(' · ')}</div>
    <div class="tc-footer">
      <div class="tc-loc">LC <span>${esc(t.location || '—')}</span></div>
      <button class="tc-print-btn" onclick="event.stopPropagation();printBinLabel('${t.id}')">🏷 Label</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════
// DETAIL PANEL
// ═══════════════════════════════════════════════════════
function openDetail(id) {
  activeTool = library.tools.find(t => t.id === id);
  if (!activeTool) return;
  dpMode = 'detail';
  editPhoto = activeTool.photo || null;
  document.getElementById('dpTitle').textContent = activeTool.description || 'Tool #' + activeTool.id;
  document.getElementById('dpIdBadge').textContent = '#' + activeTool.id;
  renderDpTab();
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
}

function closeDetail() {
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailPanel').classList.remove('open');
  activeTool = null;
}

function switchDpTab(tab) {
  dpMode = tab;
  document.querySelectorAll('.dp-tab').forEach((t,i) => t.classList.toggle('active', ['detail','jobs','edit'][i] === tab));
  renderDpTab();
}

function renderDpTab() {
  if (dpMode === 'detail') renderDetailView();
  else if (dpMode === 'jobs') renderJobsView();
  else renderEditView();
}

function renderDetailView() {
  const t = activeTool;
  const fields = getDetailFields(t);

  const photoHTML = t.photo
    ? `<img src="${t.photo}" alt="tool" />`
    : `<div class="detail-photo-placeholder">🔧</div>`;

  const edpHTML = t.edps && t.edps.length
    ? t.edps.map(e => `<span style="background:var(--bg);border:1px solid var(--border);border-radius:3px;padding:2px 8px;font-family:var(--mono);font-size:0.78rem;margin-right:6px;margin-bottom:4px;display:inline-block">${esc(e)}</span>`).join('')
    : '<span style="color:var(--muted);font-family:var(--mono);font-size:0.78rem">None</span>';

  document.getElementById('dpBody').innerHTML = `
    <div class="detail-photo">${photoHTML}</div>
    <div class="detail-fields">
      ${fields.map(f => `<div class="detail-field${f.full?' full':''}${f.highlight?' highlight':''}">
        <div class="detail-field-label">${esc(f.label)}</div>
        <div class="detail-field-value">${f.value}</div>
      </div>`).join('')}
      <div class="detail-field full">
        <div class="detail-field-label">EDP Numbers</div>
        <div class="detail-field-value" style="font-weight:400">${edpHTML}</div>
      </div>
      ${t.notes ? `<div class="detail-field full">
        <div class="detail-field-label">Notes</div>
        <div class="detail-field-value" style="font-weight:400;font-size:0.8rem;line-height:1.5;white-space:pre-wrap">${esc(t.notes)}</div>
      </div>` : ''}
    </div>`;

  document.getElementById('dpActions').innerHTML = `
    <button class="dp-btn blue" onclick="switchDpTab('edit')">✏ Edit</button>
    <button class="dp-btn green" onclick="printBinLabel('${t.id}')">🏷 Print Bin Label</button>
    <button class="dp-btn danger" onclick="deleteTool('${t.id}')">🗑 Delete</button>`;
}

function getDetailFields(t) {
  const f = [];
  f.push({ label: 'Type',        value: esc(t.type||'—'), highlight: true });
  f.push({ label: 'Pro Shop #',  value: esc(t.proShopNum||'—') });
  f.push({ label: 'RTA #',       value: esc(t.rtaNum||'—') });
  f.push({ label: 'Location',    value: esc(t.location||'—') });
  f.push({ label: 'Holder',      value: esc(t.holder||'—') });
  f.push({ label: 'Vendor',      value: esc(t.vendor||'—') });
  f.push({ label: 'Order #',     value: esc(t.orderNum||'—') });
  f.push({ label: 'Coating',     value: esc(t.coating||'—') });
  if (t.diameter !== undefined && t.diameter !== '') f.push({ label: 'Diameter', value: displayDiam(t.diameter) });
  if (t.loc !== undefined && t.loc !== '')           f.push({ label: 'LOC',      value: displayLen(t.loc) });
  if (t.reach !== undefined && t.reach !== '')       f.push({ label: 'Total Reach', value: displayLen(t.reach) });
  if (t.flutes)      f.push({ label: 'Flutes',       value: esc(t.flutes) });
  if (t.helixAngle)  f.push({ label: 'Helix Angle',  value: esc(t.helixAngle) + '°' });
  if (t.tsc)         f.push({ label: 'TSC',           value: esc(t.tsc) });
  if (t.reducedShank)f.push({ label: 'Reduced Shank', value: esc(t.reducedShank) });
  if (t.bottomCutting) f.push({ label: 'Bottom Cutting', value: esc(t.bottomCutting) });
  if (t.cornerRadius)  f.push({ label: 'Corner Radius', value: displayLen(t.cornerRadius) });
  if (t.pointAngle)    f.push({ label: 'Point Angle',   value: esc(t.pointAngle) + '°' });
  if (t.splitPoint)    f.push({ label: 'Split Point',   value: esc(t.splitPoint) });
  if (t.drillType)     f.push({ label: 'Drill Type',    value: esc(t.drillType) });
  if (t.includedAngle) f.push({ label: 'Included Angle', value: esc(t.includedAngle) + '°' });
  if (t.tipFlat)       f.push({ label: 'Tip Flat',       value: displayLen(t.tipFlat) });
  if (t.tipFlatDiam)   f.push({ label: 'Tip Flat Dia',   value: displayLen(t.tipFlatDiam) });
  if (t.radius)        f.push({ label: 'Radius',         value: displayLen(t.radius) });
  if (t.pitch)         f.push({ label: 'Pitch/TPI',      value: esc(t.pitch) });
  if (t.pitchMin)      f.push({ label: 'Pitch Min',      value: esc(t.pitchMin) });
  if (t.pitchMax)      f.push({ label: 'Pitch Max',      value: esc(t.pitchMax) });
  if (t.teethCount)    f.push({ label: 'Teeth Count',    value: esc(t.teethCount) });
  if (t.tipToThread)   f.push({ label: 'Tip to Thread',  value: displayLen(t.tipToThread) });
  if (t.tipFlatLen)    f.push({ label: 'Tip Flat Length', value: displayLen(t.tipFlatLen) });
  if (t.threadIntExt)  f.push({ label: 'Int / Ext',      value: esc(t.threadIntExt) });
  if (t.tapType)       f.push({ label: 'Tap Type',       value: esc(t.tapType) });
  if (t.threadStd)     f.push({ label: 'Thread Std',     value: esc(t.threadStd) });
  if (t.reamType)      f.push({ label: 'Reamer Type',    value: esc(t.reamType) });
  if (t.cdType)        f.push({ label: 'Center Drill Type', value: esc(t.cdType) });
  if (t.kerfWidth)     f.push({ label: 'Kerf Width',     value: displayLen(t.kerfWidth) });
  if (t.arborDiam)     f.push({ label: 'Arbor Diameter', value: displayLen(t.arborDiam) });
  if (t.minBore)       f.push({ label: 'Min Bore',       value: displayLen(t.minBore) });
  if (t.maxBore)       f.push({ label: 'Max Bore',       value: displayLen(t.maxBore) });
  if (t.maxRPM)        f.push({ label: 'Max RPM',        value: esc(t.maxRPM) });
  if (t.arborBore)     f.push({ label: 'Arbor Bore',     value: displayLen(t.arborBore) });
  if (t.insertDesig)   f.push({ label: 'ANSI/ISO',       value: esc(t.insertDesig) });
  if (t.insertGeom)    f.push({ label: 'Geometry',       value: esc(t.insertGeom) });
  if (t.insertGrade)   f.push({ label: 'Grade',          value: esc(t.insertGrade) });
  if (t.qtyOnHand !== undefined && t.qtyOnHand !== '') f.push({ label: 'Qty on Hand', value: esc(t.qtyOnHand) });
  if (t.reorderQty)    f.push({ label: 'Reorder Qty',    value: esc(t.reorderQty) });
  if (t.compatBodies && t.compatBodies.length) f.push({ label: 'Compatible Bodies', value: esc(t.compatBodies.join(', ')), full: true });
  if (t.compatInserts && t.compatInserts.length) f.push({ label: 'Compatible Inserts', value: esc(t.compatInserts.join(', ')), full: true });
  return f;
}

function renderJobsView() {
  const t = activeTool;
  const jobs = t.jobs || [];
  document.getElementById('dpBody').innerHTML = `
    <div class="detail-section-title">Jobs / Part Numbers</div>
    <div class="jobs-list" id="toolJobsList">
      ${jobs.length ? jobs.map(j => `
        <div class="job-tag">${esc(j)}
          <button class="job-remove" onclick="removeJobFromTool('${esc(j)}')">✕</button>
        </div>`).join('') : '<span style="font-family:var(--mono);font-size:0.78rem;color:var(--muted)">No jobs linked yet.</span>'}
    </div>
    <div class="job-add-row" style="margin-top:12px">
      <select class="job-select" id="jobToAdd">
        <option value="">Select a part number...</option>
        ${(library.jobs||[]).filter(j => !jobs.includes(j)).map(j => `<option value="${esc(j)}">${esc(j)}</option>`).join('')}
      </select>
      <button class="dp-btn blue" style="flex:0;padding:8px 14px" onclick="addJobToTool()">Add</button>
    </div>`;

  document.getElementById('dpActions').innerHTML = `
    <button class="dp-btn blue" onclick="switchDpTab('detail')">← Back to Detail</button>`;
}

function addJobToTool() {
  const sel = document.getElementById('jobToAdd');
  const j   = sel.value; if (!j) return;
  if (!activeTool.jobs) activeTool.jobs = [];
  if (!activeTool.jobs.includes(j)) { activeTool.jobs.push(j); saveLibrary(); renderJobsView(); }
}

function removeJobFromTool(j) {
  if (!activeTool.jobs) return;
  activeTool.jobs = activeTool.jobs.filter(x => x !== j);
  saveLibrary(); renderJobsView();
}

// ═══════════════════════════════════════════════════════
// EDIT / ADD FORM
// ═══════════════════════════════════════════════════════
function openAddTool() {
  activeTool = { id: nextToolId(), type: 'Endmill', jobs: [], edps: [] };
  dpMode = 'edit';
  editPhoto = null;
  document.getElementById('dpTitle').textContent = 'Add New Tool';
  document.getElementById('dpIdBadge').textContent = '#' + activeTool.id;
  document.querySelectorAll('.dp-tab').forEach((t,i) => t.classList.toggle('active', i === 2));
  renderEditView();
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailPanel').classList.add('open');
}

function renderEditView() {
  const t = activeTool;
  editPhoto = editPhoto || t.photo || null;

  const typeFields = getTypeFields(t.type || 'Endmill');

  document.getElementById('dpBody').innerHTML = `
    <div class="form-grid">
      <div class="form-section-title">Identity</div>

      <div class="form-group">
        <label class="form-label">Tool Type</label>
        <select class="form-input" id="ef-type" onchange="onTypeChange()">
          ${TOOL_TYPES.map(ty => `<option value="${ty}"${ty===(t.type||'Endmill')?' selected':''}>${ty}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <input class="form-input" id="ef-desc" type="text" value="${esc(t.description||'')}" placeholder="e.g. 3/8 Endmill 3FL" />
      </div>
      <div class="form-group">
        <label class="form-label">Pro Shop Tool #</label>
        <input class="form-input" id="ef-psnm" type="text" value="${esc(t.proShopNum||'')}" placeholder="e.g. A-13" />
      </div>
      <div class="form-group">
        <label class="form-label">RTA #</label>
        <input class="form-input" id="ef-rta" type="text" value="${esc(t.rtaNum||'')}" />
      </div>
      <div class="form-group">
        <label class="form-label">Storage Location</label>
        <input class="form-input" id="ef-loc" type="text" value="${esc(t.location||'')}" placeholder="e.g. 24" />
      </div>
      <div class="form-group">
        <label class="form-label">Holder</label>
        <input class="form-input" id="ef-holder" type="text" value="${esc(t.holder||'')}" placeholder="e.g. SK13-120" />
      </div>

      <div class="form-section-title">Dimensions (inches)</div>
      <div class="form-group">
        <label class="form-label">Diameter (in)</label>
        <input class="form-input" id="ef-diam" type="number" step="0.0001" value="${t.diameter||''}" placeholder="e.g. 0.375" />
      </div>
      <div class="form-group">
        <label class="form-label">LOC (in)</label>
        <input class="form-input" id="ef-loc2" type="number" step="0.0001" value="${t.loc||''}" />
      </div>
      <div class="form-group">
        <label class="form-label">Total Reach (in)</label>
        <input class="form-input" id="ef-reach" type="number" step="0.0001" value="${t.reach||''}" />
      </div>
      <div class="form-group">
        <label class="form-label">Reduced Shank</label>
        <select class="form-input" id="ef-reduced">
          <option value="">—</option>
          <option value="Yes"${t.reducedShank==='Yes'?' selected':''}>Yes</option>
          <option value="No"${t.reducedShank==='No'?' selected':''}>No</option>
        </select>
      </div>

      <div class="form-section-title">Tool Properties</div>
      <div class="form-group">
        <label class="form-label">Coating</label>
        <select class="form-input" id="ef-coating">
          ${COATINGS.map(c => `<option value="${c}"${c===(t.coating||'None')?' selected':''}>${c}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">TSC</label>
        <select class="form-input" id="ef-tsc">
          <option value="">—</option>
          <option value="Yes"${t.tsc==='Yes'?' selected':''}>Yes</option>
          <option value="No"${t.tsc==='No'?' selected':''}>No</option>
        </select>
      </div>

      <div id="type-specific-fields" style="display:contents">${typeFields}</div>

      <div class="form-section-title">Ordering</div>
      <div class="form-group">
        <label class="form-label">Vendor</label>
        <input class="form-input" id="ef-vendor" type="text" value="${esc(t.vendor||'')}" />
      </div>
      <div class="form-group">
        <label class="form-label">Order #</label>
        <input class="form-input" id="ef-order" type="text" value="${esc(t.orderNum||'')}" />
      </div>

      <div class="form-section-title">EDP Numbers</div>
      <div class="form-group full">
        <div class="edp-form-list" id="edp-form-list">
          ${(t.edps||['']).map((e,i) => `
            <div class="edp-form-row">
              <input class="form-input" type="text" value="${esc(e)}" data-edp-idx="${i}" placeholder="EDP #" />
              <button class="edp-rm" onclick="removeEdpForm(this)">✕</button>
            </div>`).join('')}

      <div class="form-group full">
        <div class="photo-upload-area" id="photo-upload-area">
          <input type="file" accept="image/*" id="photo-file-input" />
          <div id="photo-upload-inner">
            ${editPhoto
              ? `<div class="photo-preview-wrap"><img class="photo-preview" src="${editPhoto}" /><button class="photo-clear" onclick="clearEditPhoto(event)">✕</button></div>`
              : `<span style="font-size:1.4rem;display:block;margin-bottom:6px">📷</span><div class="photo-upload-text">Drop image or click to browse</div>`}
          </div>
        </div>

      <div class="form-section-title">Notes</div>
      <div class="form-group full">
        <textarea class="form-input" id="ef-notes" rows="3" placeholder="Any additional notes...">${esc(t.notes||'')}</textarea>

  // wire photo upload

  const pInput = document.getElementById('photo-file-input');
  pArea.addEventListener('dragover', e => { e.preventDefault(); pArea.classList.add('drag-over'); });
  pArea.addEventListener('dragleave', () => pArea.classList.remove('drag-over'));
  pArea.addEventListener('drop', e => {
    e.preventDefault(); pArea.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadEditPhoto(f);
  });
  pInput.addEventListener('change', e => { if (e.target.files[0]) loadEditPhoto(e.target.files[0]); pInput.value=''; });

  document.getElementById('dpActions').innerHTML = `
    <button class="dp-btn blue" onclick="saveTool()">💾 Save Tool</button>
    <button class="dp-btn ghost" onclick="cancelEdit()">Cancel</button>`;
}

function getTypeFields(type) {
  const t = activeTool;
  let html = '';

  const numField = (id, label, val, step='0.0001') =>
    `<div class="form-group"><label class="form-label">${label}</label><input class="form-input" id="${id}" type="number" step="${step}" value="${val||''}" /></div>`;
  const txtField = (id, label, val, ph='') =>
    `<div class="form-group"><label class="form-label">${label}</label><input class="form-input" id="${id}" type="text" value="${esc(val||'')}" placeholder="${ph}" /></div>`;
  const selField = (id, label, opts, val) =>
    `<div class="form-group"><label class="form-label">${label}</label><select class="form-input" id="${id}">${opts.map(o=>`<option value="${o}"${o===val?' selected':''}>${o}</option>`).join('')}</select></div>`;

  if (['Endmill','Ball Mill','Bull Nose Mill'].includes(type)) {
    html += txtField('ef-flutes','Flutes',t.flutes);
    html += numField('ef-helix','Helix Angle (°)',t.helixAngle,'1');
    if (type === 'Bull Nose Mill') html += numField('ef-cr','Corner Radius (in)',t.cornerRadius);
    if (['Endmill','Bull Nose Mill'].includes(type))
      html += selField('ef-bc','Bottom Cutting',BC_TYPES,t.bottomCutting||BC_TYPES[0]);
  }
  if (type === 'Chamfer Mill') {
    html += txtField('ef-flutes','Flutes',t.flutes);
    html += numField('ef-incang','Included Angle (°)',t.includedAngle,'0.1');
    html += numField('ef-tipdiam','Tip Diameter (in)',t.tipDiameter);
    html += numField('ef-tipflatd','Tip Flat Diameter (in)',t.tipFlatDiam);
  }
  if (type === 'Corner Rounding') {
    html += txtField('ef-flutes','Flutes',t.flutes);
    html += numField('ef-radius','Radius (in)',t.radius);
  }
  if (type === 'Thread Mill') {
    html += txtField('ef-flutes','Flutes',t.flutes);
    html += numField('ef-pitchmin','Pitch Min',t.pitchMin,'0.001');
    html += numField('ef-pitchmax','Pitch Max',t.pitchMax,'0.001');
    html += txtField('ef-teeth','Teeth Count',t.teethCount);
    html += numField('ef-tipthread','Tip to Thread Start (in)',t.tipToThread);
    html += numField('ef-tipflatlen','Tip Flat Length (in)',t.tipFlatLen);
    html += selField('ef-intext','Internal / External',['Internal','External','Both'],t.threadIntExt||'Internal');
  }
  if (type === 'Drill') {
    html += txtField('ef-flutes','Flutes',t.flutes);
    html += numField('ef-ptang','Point Angle (°)',t.pointAngle,'0.1');
    html += selField('ef-splitpt','Split Point',['Yes','No','—'],t.splitPoint||'—');
    html += selField('ef-drtype','Drill Type',DRILL_TYPES,t.drillType||DRILL_TYPES[0]);
  }
  if (type === 'Spot Drill') {
    html += txtField('ef-flutes','Flutes',t.flutes);
    html += numField('ef-ptang','Point Angle (°)',t.pointAngle,'0.1');
    html += numField('ef-tipflat','Tip Flat (in)',t.tipFlat);
  }
  if (type === 'Center Drill') {
    html += selField('ef-cdtype','Type',CD_TYPES,t.cdType||CD_TYPES[0]);
    html += numField('ef-ptang','Point Angle (°)',t.pointAngle,'0.1');
  }
  if (type === 'Tap') {
    html += numField('ef-pitch','Pitch / TPI',t.pitch,'0.001');
    html += selField('ef-taptype','Tap Type',TAP_TYPES,t.tapType||TAP_TYPES[0]);
    html += numField('ef-tipthread','Tip to Thread Start (in)',t.tipToThread);
    html += selField('ef-thrstd','Thread Standard',THREAD_STDS,t.threadStd||THREAD_STDS[0]);
  }
  if (type === 'Reamer') {
    html += txtField('ef-flutes','Flutes',t.flutes);
    html += selField('ef-reamtype','Reamer Type',REAMER_TYPES,t.reamType||REAMER_TYPES[0]);
  }
  if (type === 'Boring Bar') {
    html += numField('ef-minbore','Min Bore (in)',t.minBore);
    html += numField('ef-maxbore','Max Bore (in)',t.maxBore);
  }
  if (type === 'Saw') {
    html += txtField('ef-teeth','Teeth Count',t.teethCount);
    html += numField('ef-kerf','Kerf Width (in)',t.kerfWidth);
    html += numField('ef-arbor','Arbor Diameter (in)',t.arborDiam);
  }
  if (type === 'Insert Mill Body') {
    html += txtField('ef-maxrpm','Max RPM',t.maxRPM);
    html += numField('ef-arborbore','Arbor Bore (in)',t.arborBore);
  }
  if (type === 'Insert') {
    html += txtField('ef-insdesig','ANSI/ISO Designation',t.insertDesig,'e.g. APMT1135');
    html += txtField('ef-insgeom','Geometry',t.insertGeom);
    html += txtField('ef-insgrade','Grade',t.insertGrade);
    html += txtField('ef-qtyhand','Qty on Hand',t.qtyOnHand);
    html += txtField('ef-reorderqty','Reorder Qty',t.reorderQty);
  }
  return html;
}

function onTypeChange() {
  const type = document.getElementById('ef-type').value;
  activeTool.type = type;
  // re-render only the type-specific section
  const container = document.getElementById('type-specific-fields');
  if (container) container.innerHTML = getTypeFields(type);
}

function addEdpForm() {
  const list = document.getElementById('edp-form-list');
  const row  = document.createElement('div');
  row.className = 'edp-form-row';
  const idx = list.children.length;
  row.innerHTML = `<input class="form-input" type="text" data-edp-idx="${idx}" placeholder="EDP #" /><button class="edp-rm" onclick="removeEdpForm(this)">✕</button>`;
  list.appendChild(row);
  row.querySelector('input').focus();
}

function removeEdpForm(btn) {
  const rows = document.querySelectorAll('#edp-form-list .edp-form-row');
  if (rows.length > 1) btn.parentElement.remove();
  else btn.parentElement.querySelector('input').value = '';
}

function loadEditPhoto(file) {
  const reader = new FileReader();
  reader.onload = ev => {
    editPhoto = ev.target.result;
    document.getElementById('photo-upload-inner').innerHTML =
      `<div class="photo-preview-wrap"><img class="photo-preview" src="${editPhoto}" /><button class="photo-clear" onclick="clearEditPhoto(event)">✕</button></div>`;
  };
  reader.readAsDataURL(file);
}

function clearEditPhoto(e) {
  e.stopPropagation();
  editPhoto = null;
  document.getElementById('photo-upload-inner').innerHTML =
    `<span style="font-size:1.4rem;display:block;margin-bottom:6px">📷</span><div class="photo-upload-text">Drop image or click to browse</div>`;
}

function gv(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

function saveTool() {
  const t = activeTool;
  t.type         = gv('ef-type') || t.type;
  t.description  = gv('ef-desc');
  t.proShopNum   = gv('ef-psnm');
  t.rtaNum       = gv('ef-rta');
  t.location     = gv('ef-loc');
  t.holder       = gv('ef-holder');
  t.diameter     = gv('ef-diam');
  t.loc          = gv('ef-loc2');
  t.reach        = gv('ef-reach');
  t.reducedShank = gv('ef-reduced');
  t.coating      = gv('ef-coating');
  t.tsc          = gv('ef-tsc');
  t.vendor       = gv('ef-vendor');
  t.orderNum     = gv('ef-order');
  t.notes        = gv('ef-notes');
  t.photo        = editPhoto;

  // type specific
  t.flutes       = gv('ef-flutes');
  t.helixAngle   = gv('ef-helix');
  t.cornerRadius = gv('ef-cr');
  t.bottomCutting= gv('ef-bc');
  t.includedAngle= gv('ef-incang');
  t.tipDiameter  = gv('ef-tipdiam');
  t.tipFlatDiam  = gv('ef-tipflatd');
  t.radius       = gv('ef-radius');
  t.pitchMin     = gv('ef-pitchmin');
  t.pitchMax     = gv('ef-pitchmax');
  t.teethCount   = gv('ef-teeth');
  t.tipToThread  = gv('ef-tipthread');
  t.tipFlatLen   = gv('ef-tipflatlen');
  t.threadIntExt = gv('ef-intext');
  t.pointAngle   = gv('ef-ptang');
  t.splitPoint   = gv('ef-splitpt');
  t.drillType    = gv('ef-drtype');
  t.tipFlat      = gv('ef-tipflat');
  t.cdType       = gv('ef-cdtype');
  t.pitch        = gv('ef-pitch');
  t.tapType      = gv('ef-taptype');
  t.threadStd    = gv('ef-thrstd');
  t.reamType     = gv('ef-reamtype');
  t.minBore      = gv('ef-minbore');
  t.maxBore      = gv('ef-maxbore');
  t.kerfWidth    = gv('ef-kerf');
  t.arborDiam    = gv('ef-arbor');
  t.maxRPM       = gv('ef-maxrpm');
  t.arborBore    = gv('ef-arborbore');
  t.insertDesig  = gv('ef-insdesig');
  t.insertGeom   = gv('ef-insgeom');
  t.insertGrade  = gv('ef-insgrade');
  t.qtyOnHand    = gv('ef-qtyhand');
  t.reorderQty   = gv('ef-reorderqty');

  // EDPs
  t.edps = Array.from(document.querySelectorAll('[data-edp-idx]')).map(i => i.value.trim()).filter(Boolean);

  // upsert
  const idx = library.tools.findIndex(x => x.id === t.id);
  if (idx >= 0) library.tools[idx] = t;
  else library.tools.push(t);

  saveLibrary();
  renderAll();
  dpMode = 'detail';
  document.getElementById('dpTitle').textContent = t.description || 'Tool #' + t.id;
  document.querySelectorAll('.dp-tab').forEach((tb,i) => tb.classList.toggle('active', i === 0));
  renderDetailView();
}

function cancelEdit() {
  const isNew = !library.tools.find(x => x.id === activeTool.id);
  if (isNew) { closeDetail(); return; }
  dpMode = 'detail';
  document.querySelectorAll('.dp-tab').forEach((tb,i) => tb.classList.toggle('active', i === 0));
  renderDetailView();
}

function deleteTool(id) {
  if (!confirm('Delete this tool from the library? This cannot be undone.')) return;
  library.tools = library.tools.filter(t => t.id !== id);
  saveLibrary(); renderAll(); closeDetail();
}

// ═══════════════════════════════════════════════════════
// JOBS MODAL
// ═══════════════════════════════════════════════════════
function openJobsModal() {
  renderJobList();
  document.getElementById('jobsModal').classList.add('open');
}
function closeJobsModal() {
  document.getElementById('jobsModal').classList.remove('open');
  updateJobFilter();
  applyFilters();
}
function renderJobList() {
  const c = document.getElementById('jobListContainer');
  if (!library.jobs || !library.jobs.length) {
    c.innerHTML = '<div style="font-family:var(--mono);font-size:0.78rem;color:var(--muted);padding:8px 0">No part numbers added yet.</div>';
    return;
  }
  c.innerHTML = library.jobs.map(j => `
    <div class="job-list-item">
      <span class="job-list-item-name">${esc(j)}</span>
      <button class="job-list-rm" onclick="removeJob('${esc(j)}')">✕ Remove</button>
    </div>`).join('');
}
function addJob() {
  const inp = document.getElementById('newJobInput');
  const val = inp.value.trim(); if (!val) return;
  if (!library.jobs) library.jobs = [];
  if (!library.jobs.includes(val)) { library.jobs.push(val); saveLibrary(); renderJobList(); }
  inp.value = '';
}
function removeJob(j) {
  library.jobs = (library.jobs||[]).filter(x => x !== j);
  library.tools.forEach(t => { if (t.jobs) t.jobs = t.jobs.filter(x => x !== j); });
  saveLibrary(); renderJobList();
}

// ═══════════════════════════════════════════════════════
// PRINT BIN LABEL
// ═══════════════════════════════════════════════════════
function printBinLabel(id) {
  const t = library.tools.find(x => x.id === id); if (!t) return;
  const edpText = (t.edps||[]).length ? t.edps.map(e => '• ' + e).join('  ') : '';
  const imgHTML = t.photo ? `<img src="${t.photo}" alt="tool" />` : `<div class="label-img-placeholder">No image</div>`;
  const label = `<div class="label-card">
    <div class="label-left">
      <div class="label-top-row">
        <div class="label-lc">${esc(t.location||'—')}</div>
        <div class="label-tool-id">${esc(t.proShopNum||t.id)}</div>
      </div>
      <div class="label-desc"><span>${esc(t.description||'')}</span></div>
      <div class="label-edps">${edpText}</div>
    </div>
    <div class="label-img-area">${imgHTML}</div>
  </div>`;
  document.getElementById('print-container').innerHTML = `<div class="print-page">${label}</div>`;
  window.print();
}

loadLibrary();
renderAll();
